name: Gun Sonu Telegram Raporu

on:
  # Gun sonu raporunu artik nobetci.py gonderiyor; bu is sadece elle (ara rapor) calisir.
  workflow_dispatch:
    inputs:
      ara:
        description: "Anlik ara rapor (gun sonu yerine)"
        type: boolean
        default: false

jobs:
  rapor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Raporu gonder
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAPER: "true"
        run: python telegram_rapor.py ${{ inputs.ara && '--ara' || '' }}
